name: Reusable Claude PR Review

# Centralized Claude review implementation. Calling repositories keep only
# event-specific authorization and forward their Claude OAuth secret.

on:
  workflow_call:
    inputs:
      review_mode:
        description: "Review trigger mode: auto for new PRs, on-demand for @claude comments."
        type: string
        required: true
      model:
        description: "Claude model identifier used for the review."
        type: string
        required: false
        default: "claude-opus-5"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  auto-review:
    name: Claude Auto Review
    if: inputs.review_mode == 'auto'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Collect referenced issue context
        id: issue_context
        uses: actions/github-script@v8
        with:
          script: |
            const pullNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            const issueRefPattern = /#(\d+)/g;
            const sources = [pull.title || '', pull.body || ''];
            const prCommits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pullNumber, per_page: 100,
            });
            for (const c of prCommits) sources.push(c.commit?.message || '');
            const nums = [...new Set(
              sources.flatMap((t) => [...t.matchAll(issueRefPattern)].map((m) => Number(m[1])))
            )].slice(0, 10);
            let out = '';
            for (const num of nums) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: num });
                if (issue.pull_request) continue;
                out += `\n### Issue #${num}: ${issue.title}\n${(issue.body || '').slice(0, 2000)}\n`;
              } catch (error) {
                console.log(`Skip referenced issue #${num}: ${error.message}`);
              }
            }
            const fs = require('fs');
            const delimiter = 'ISSUE_CTX_EOF';
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `text<<${delimiter}\n${out}\n${delimiter}\n`);
      - uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          model: ${{ inputs.model }}
          direct_prompt: |
            先阅读本 PR 在标题/描述/commit 中引用的关联 Issue 背景（下方为空则表示没有引用），理解"要解决什么、为什么改、为什么这么交"，再开始 review：
            ${{ steps.issue_context.outputs.text }}

            然后 review 这个 PR，重点关注：
            1. 潜在的 bug 或逻辑错误
            2. Python/TypeScript/Rust 代码的健壮性和错误处理
            3. 安全问题（注入、越权、敏感信息泄露等）
            4. 接口设计是否合理，有无破坏性变更
            5. 改动是否真正解决了关联 Issue 的需求
            请用中文回复，给出具体的行内建议。

  on-demand-review:
    name: Claude On-demand Review
    if: inputs.review_mode == 'on-demand'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          model: ${{ inputs.model }}
