name: Test

# Contract tests exercise the exact trusted workflow bridge and both the source
# runner and production bundle. SDK socket/SSE tests remain independent.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code -- review-action/dist
      - run: node test/review-config.test.mjs
      - run: node test/pr-review.test.mjs
      - run: node --test test/review-contract.test.mjs test/review-status.test.mjs test/caller-audit.test.mjs test/review-evaluation.test.mjs test/sdk-client.test.mjs
