name: Temporary PR877 B-C diagnostic
on:
  workflow_call:
    inputs:
      central_sha:
        required: true
        type: string
    secrets:
      PR_AGENT_LANE_B_KEY:
        required: true
      PR_AGENT_LANE_B_API_BASE:
        required: true
      PR_AGENT_LANE_C_KEY:
        required: false
      PR_AGENT_LANE_C_API_BASE:
        required: false
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: isolated-pr877-bc-diagnostic
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'TshyGO/NebulaLab' && github.actor == 'TshyGO' && github.ref == 'refs/heads/diagnostic/pr877-bc-20260912'
    runs-on: ai-pr-review
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [B]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: TshyGO/ci-central
          ref: ${{ inputs.central_sha }}
          persist-credentials: false
      - name: Probe only the selected lane
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          DIAG_LANE: ${{ matrix.lane }}
          DIAG_MODE: B-original-long
          DIAG_KEY: ${{ secrets[format('PR_AGENT_LANE_{0}_KEY', matrix.lane)] }}
          DIAG_BASE: ${{ secrets[format('PR_AGENT_LANE_{0}_API_BASE', matrix.lane)] }}
        with:
          script: |
            try { await require('./diagnostics/pr877-bc.bundle.cjs').run(github); }
            catch (error) { core.setFailed(`Diagnostic setup failed; status=${error.status || 'none'} name=${error.name || 'Error'}`); }
      - name: Retain private final review and safe metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr877-b-original-long
          path: diagnostic-output/
          retention-days: 3
          if-no-files-found: warn
