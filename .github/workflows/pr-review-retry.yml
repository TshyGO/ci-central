name: AI PR Review Retry

on:
  workflow_call:
    inputs:
      run_id:
        required: true
        type: number
      workflow_name:
        required: true
        type: string
      run_event:
        required: true
        type: string
      conclusion:
        required: true
        type: string
      run_attempt:
        required: true
        type: number
      head_sha:
        required: true
        type: string
      pull_number:
        required: true
        type: number
  workflow_run:
    workflows: [AI PR Review]
    types: [completed]

permissions:
  actions: write
  issues: read
  pull-requests: read

concurrency:
  group: ai-pr-review-retry-${{ github.repository }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-lane-a-endpoint-failure:
    if: |
      github.repository == 'TshyGO/ci-central' ||
      github.repository == 'TshyGO/NebulaLab' ||
      github.repository == 'TshyGO/NebulaLab-Docs' ||
      github.repository == 'TshyGO/NebulaLab-Plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry failed AI review job once for Lane A endpoint failure
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RETRY_RUN_ID: ${{ inputs.run_id }}
          RETRY_WORKFLOW_NAME: ${{ inputs.workflow_name }}
          RETRY_RUN_EVENT: ${{ inputs.run_event }}
          RETRY_CONCLUSION: ${{ inputs.conclusion }}
          RETRY_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          RETRY_HEAD_SHA: ${{ inputs.head_sha }}
          RETRY_PULL_NUMBER: ${{ inputs.pull_number }}
        with:
          script: |
            const directWorkflowRun = context.payload.workflow_run;
            const calledRunId = Number(process.env.RETRY_RUN_ID || 0);
            let workflowRun = directWorkflowRun || (calledRunId ? {
              id: calledRunId,
              name: process.env.RETRY_WORKFLOW_NAME,
              event: process.env.RETRY_RUN_EVENT,
              conclusion: process.env.RETRY_CONCLUSION,
              run_attempt: Number(process.env.RETRY_RUN_ATTEMPT || 0),
              head_sha: process.env.RETRY_HEAD_SHA,
              pull_requests: [{ number: Number(process.env.RETRY_PULL_NUMBER || 0) }],
            } : null);
            const allowedRepositories = new Set([
              'TshyGO/ci-central',
              'TshyGO/NebulaLab',
              'TshyGO/NebulaLab-Docs',
              'TshyGO/NebulaLab-Plugins',
            ]);
            if (!allowedRepositories.has(`${context.repo.owner}/${context.repo.repo}`)) {
              core.info('Skip retry: repository is not managed by ci-central.');
              return;
            }
            if (!directWorkflowRun && workflowRun) {
              const { data: authoritativeRun } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: workflowRun.id,
              });
              const metadataMatches = authoritativeRun.name === workflowRun.name
                && authoritativeRun.event === workflowRun.event
                && authoritativeRun.conclusion === workflowRun.conclusion
                && authoritativeRun.run_attempt === workflowRun.run_attempt
                && authoritativeRun.head_sha === workflowRun.head_sha;
              if (!metadataMatches) {
                core.info('Skip retry: caller metadata does not match the authoritative workflow run.');
                return;
              }
              const authoritativePulls = Array.isArray(authoritativeRun.pull_requests)
                ? authoritativeRun.pull_requests
                : [];
              const requestedPullNumber = workflowRun.pull_requests?.[0]?.number;
              if (authoritativePulls.length > 0
                && !authoritativePulls.some((pull) => pull?.number === requestedPullNumber)) {
                core.info('Skip retry: caller pull request is not linked to the authoritative workflow run.');
                return;
              }
              workflowRun = { ...authoritativeRun, pull_requests: workflowRun.pull_requests };
            }
            if (!workflowRun
              || workflowRun.name !== 'AI PR Review'
              || workflowRun.event !== 'pull_request'
              || workflowRun.conclusion !== 'failure'
              || workflowRun.run_attempt !== 1) {
              core.info('Skip retry: workflow run is not an eligible first-attempt PR review failure.');
              return;
            }

            const linkedPulls = Array.isArray(workflowRun.pull_requests) ? workflowRun.pull_requests : [];
            if (linkedPulls.length !== 1 || !linkedPulls[0]?.number) {
              core.info('Skip retry: workflow run is not linked to exactly one pull request.');
              return;
            }

            const { owner, repo } = context.repo;
            const pullNumber = linkedPulls[0].number;
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            if (pull.state !== 'open' || pull.head?.sha !== workflowRun.head_sha) {
              core.info('Skip retry: pull request closed or head changed after the failed review.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const marker = '<!-- ai-pr-review-bot:lane-A -->';
            const evidencePattern = /<!-- ai-pr-review-evidence:v2 lane=A head=([0-9a-f]{40}) workflow=([0-9a-f]{40}) status=(valid|diagnostic|partial) -->/i;
            const laneAComment = comments
              .filter((comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker))
              .at(-1);
            const evidence = laneAComment?.body?.match(evidencePattern);
            const isMatchingEndpointDiagnostic = evidence?.[1]?.toLowerCase() === workflowRun.head_sha.toLowerCase()
              && evidence?.[3]?.toLowerCase() === 'diagnostic'
              && laneAComment?.body?.includes('endpoint-unavailable')
              && laneAComment?.body?.includes('fetch failed');
            if (!isMatchingEndpointDiagnostic) {
              core.info('Skip retry: Lane A has no matching endpoint-unavailable diagnostic for this head.');
              return;
            }

            await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: workflowRun.id });
            core.info(`Requested one failed-job rerun for AI PR Review run ${workflowRun.id} on PR #${pullNumber}.`);
