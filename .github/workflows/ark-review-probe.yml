name: Bounded Ark review probe
on:
  push:
    branches: [diagnostics/ark-review-probe-20260909]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'TshyGO/ci-central'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/ark-review-probe.mjs
        env:
          ARK_KEY: ${{ secrets.PR_AGENT_LANE_B_KEY }}
          ARK_BASE: ${{ secrets.PR_AGENT_LANE_B_API_BASE }}
