name: Reusable AI PR Review

# Centralized AI PR review used across repos via `uses:`. Repository policy is resolved
# from review-action/config/repositories/<owner>__<repo>.json. Callers expose only the
# fixed Lane A/B/C credential slots and never select models, providers, or fallbacks.

on:
  workflow_call:
    inputs:
      central_workflow_sha:
        description: Full immutable ci-central commit SHA repeated from the external caller's uses pin
        required: false
        type: string
      runner_tier:
        description: >-
          Runner pool for this review: hosted (default) runs on GitHub-hosted ubuntu-latest,
          review and build select fixed self-hosted labels. Callers pick a tier, never a raw
          label, so a caller cannot route this job - and the Lane credentials it receives -
          onto an arbitrary runner.
        required: false
        default: hosted
        type: string
    secrets:
      PR_AGENT_LANE_A_KEY:
        required: false
      PR_AGENT_LANE_A_API_BASE:
        required: false
      PR_AGENT_LANE_B_KEY:
        required: false
      PR_AGENT_LANE_B_API_BASE:
        required: false
      PR_AGENT_LANE_C_KEY:
        required: false
      PR_AGENT_LANE_C_API_BASE:
        required: false

jobs:
  ai-pr-review:
    # Put every trigger for the same PR in one latest-wins group. Automatic and manual
    # reviews update the same stable Lane comments, so a new trigger cancels the older run.
    concurrency:
      group: centralized-ai-pr-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    # An unrecognised tier resolves to ubuntu-latest rather than to a self-hosted label:
    # falling back to the hosted pool is always safe, while guessing a label could place
    # Lane credentials on an unintended machine. The first step rejects the bad value so
    # the misconfiguration still fails loudly instead of silently running hosted.
    runs-on: ${{ inputs.runner_tier == 'review' && 'ai-pr-review' || inputs.runner_tier == 'build' && 'nebulalab-build' || 'ubuntu-latest' }}
    # Backstop includes B primary + fallback (30 minutes each), setup and publication.
    # Lanes publish independently; no reduction of model reasoning to meet deadlines.
    timeout-minutes: 70
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Validate runner tier
        env:
          RUNNER_TIER: ${{ inputs.runner_tier }}
        run: |
          case "${RUNNER_TIER}" in
            hosted|review|build) ;;
            *)
              echo "::error::runner_tier must be hosted, review, or build; got '${RUNNER_TIER}'." >&2
              exit 1
              ;;
          esac
          echo "runner_tier=${RUNNER_TIER} runner=${RUNNER_NAME:-unknown}"

      - name: Resolve matching central ref
        id: central-ref
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          JOB_WORKFLOW_SHA: ${{ github.job_workflow_sha }}
          JOB_WORKFLOW_REF: ${{ github.job_workflow_ref }}
          CALLER_WORKFLOW_SHA: ${{ inputs.central_workflow_sha }}
          EVENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        with:
          script: |
            const shaPattern = /^[0-9a-f]{40}$/;
            const repository = process.env.REPOSITORY || '';
            const jobWorkflowSha = (process.env.JOB_WORKFLOW_SHA || '').trim().toLowerCase();
            const jobWorkflowRef = (process.env.JOB_WORKFLOW_REF || '').trim();
            const callerWorkflowSha = (process.env.CALLER_WORKFLOW_SHA || '').trim().toLowerCase();
            const eventSha = (process.env.EVENT_SHA || '').trim().toLowerCase();
            const expectedPrefix = 'TshyGO/ci-central/.github/workflows/pr-review.yml@';
            let ref = jobWorkflowSha;

            if (jobWorkflowSha && !shaPattern.test(jobWorkflowSha)) {
              throw new Error('github.job_workflow_sha is present but is not a full 40-character SHA.');
            }
            if (jobWorkflowRef) {
              if (!jobWorkflowRef.startsWith(expectedPrefix)) {
                throw new Error('github.job_workflow_ref does not identify the exact ci-central pr-review workflow.');
              }
              const refSha = jobWorkflowRef.slice(expectedPrefix.length).toLowerCase();
              if (!shaPattern.test(refSha)) {
                throw new Error('github.job_workflow_ref must be pinned to a full 40-character ci-central SHA.');
              }
              if (ref && ref !== refSha) {
                throw new Error('github.job_workflow_sha and github.job_workflow_ref disagree.');
              }
              ref = refSha;
            }

            if (repository === 'TshyGO/ci-central') {
              if (!ref) ref = eventSha;
              if (callerWorkflowSha && callerWorkflowSha !== ref) {
                throw new Error('The same-repository central_workflow_sha does not match the resolved PR workflow SHA.');
              }
            } else {
              if (!shaPattern.test(callerWorkflowSha)) {
                throw new Error('External callers must repeat their full ci-central uses pin as central_workflow_sha.');
              }
              if (ref && ref !== callerWorkflowSha) {
                throw new Error('The reusable workflow context SHA does not match central_workflow_sha.');
              }
              if (!ref) {
                core.warning('GitHub did not expose job_workflow_sha or job_workflow_ref; relying on the reviewed caller central_workflow_sha input.');
              }
              ref = callerWorkflowSha;
            }

            if (!shaPattern.test(ref)) {
              throw new Error('Cannot resolve a trusted 40-character ci-central workflow SHA.');
            }
            core.setOutput('sha', ref);

      - name: Check out matching central configuration
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: TshyGO/ci-central
          ref: ${{ steps.central-ref.outputs.sha }}
          path: .ci-central
          sparse-checkout: review-action

      - name: Resolve repository review configuration
        id: review-config
        uses: ./.ci-central/review-action
        with:
          repository: ${{ github.repository }}

      - name: Review pull request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          LANE_A_KEY: ${{ secrets.PR_AGENT_LANE_A_KEY }}
          LANE_A_API_BASE: ${{ secrets.PR_AGENT_LANE_A_API_BASE }}
          LANE_B_KEY: ${{ secrets.PR_AGENT_LANE_B_KEY }}
          LANE_B_API_BASE: ${{ secrets.PR_AGENT_LANE_B_API_BASE }}
          LANE_C_KEY: ${{ secrets.PR_AGENT_LANE_C_KEY }}
          LANE_C_API_BASE: ${{ secrets.PR_AGENT_LANE_C_API_BASE }}
          PR_REVIEW_CONFIG: ${{ steps.review-config.outputs.config }}
          PR_REVIEW_WORKFLOW_SHA: ${{ steps.central-ref.outputs.sha }}
        with:
          script: |
            const { runReview } = require('./.ci-central/review-action/dist/review-runner.js');
            await runReview({ github, context, env: process.env });
