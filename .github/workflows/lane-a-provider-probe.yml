name: Lane A Provider Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lane-a-provider-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LANE_A_KEY: ${{ secrets.PR_AGENT_LANE_A_KEY }}
      LANE_A_API_BASE: ${{ secrets.PR_AGENT_LANE_A_API_BASE }}
    steps:
      - name: Discover and probe Lane A models
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const apiKey = process.env.LANE_A_KEY;
            const baseUrl = (process.env.LANE_A_API_BASE || '').replace(/\/$/, '');
            if (!apiKey || !baseUrl) {
              core.setFailed('Lane A credentials are not configured.');
              return;
            }

            const headers = {
              Authorization: `Bearer ${apiKey}`,
              'Content-Type': 'application/json',
            };

            const modelsController = new AbortController();
            const modelsTimeout = setTimeout(() => modelsController.abort(), 30_000);
            let modelsResponse;
            let modelsText;
            try {
              modelsResponse = await fetch(`${baseUrl}/models`, {
                headers,
                signal: modelsController.signal,
              });
              modelsText = await modelsResponse.text();
            } catch (error) {
              const cause = error?.cause?.code || error?.cause?.name || error?.name || 'unknown';
              core.setFailed(`Lane A /models request failed: ${cause}`);
              return;
            } finally {
              clearTimeout(modelsTimeout);
            }
            if (!modelsResponse.ok) {
              core.setFailed(`Lane A /models failed with HTTP ${modelsResponse.status}.`);
              return;
            }

            let modelsPayload;
            try {
              modelsPayload = JSON.parse(modelsText);
            } catch {
              core.setFailed('Lane A /models returned invalid JSON.');
              return;
            }

            const modelIds = (Array.isArray(modelsPayload.data) ? modelsPayload.data : [])
              .map((model) => model?.id)
              .filter((id) => typeof id === 'string' && id.length > 0)
              .sort();
            console.log(`Lane A models (${modelIds.length}): ${modelIds.join(', ')}`);

            const requiredModels = ['qwen3.8-max', 'qwen3.6-flash'];
            const missingModels = requiredModels.filter((id) => !modelIds.includes(id));
            if (missingModels.length > 0) {
              core.setFailed(`Required Lane A models are absent from /models: ${missingModels.join(', ')}`);
              return;
            }

            async function probe(modelId) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 180_000);
              const body = {
                model: modelId,
                messages: [
                  { role: 'system', content: 'Return only the requested final answer.' },
                  { role: 'user', content: 'Reply with exactly OK.' },
                ],
                stream: false,
                max_tokens: 2048,
                temperature: 0.2,
              };

              try {
                const startedAt = Date.now();
                const response = await fetch(`${baseUrl}/chat/completions`, {
                  method: 'POST',
                  headers,
                  body: JSON.stringify(body),
                  signal: controller.signal,
                });
                const text = await response.text();
                let payload = null;
                try {
                  payload = JSON.parse(text);
                } catch {}
                const message = payload?.choices?.[0]?.message;
                const content = typeof message?.content === 'string' ? message.content.trim() : '';
                const reasoning = typeof message?.reasoning_content === 'string' ? message.reasoning_content : '';
                const finishReason = payload?.choices?.[0]?.finish_reason ?? 'not-reported';
                const elapsedMs = Date.now() - startedAt;
                console.log(
                  `[${modelId}] HTTP ${response.status} finish=${finishReason} elapsedMs=${elapsedMs} contentLen=${content.length} reasoningLen=${reasoning.length}`,
                );
                if (!response.ok || !content) {
                  const detail = payload?.error?.code
                    || payload?.error?.type
                    || (response.ok ? 'empty-content' : 'http-error');
                  return { modelId, usable: false, detail };
                }
                return { modelId, usable: true, detail: 'ok' };
              } catch (error) {
                const cause = error?.cause?.code || error?.cause?.name || error?.name || 'unknown';
                console.log(`[${modelId}] request failed cause=${cause}`);
                return { modelId, usable: false, detail: cause };
              } finally {
                clearTimeout(timeout);
              }
            }

            const results = await Promise.all(requiredModels.map((modelId) => probe(modelId)));
            for (const result of results) {
              console.log(`[${result.modelId}] usable=${result.usable} detail=${result.detail}`);
            }
            const unusableModels = results.filter((result) => !result.usable).map((result) => result.modelId);
            if (unusableModels.length > 0) {
              core.setFailed(`Required Lane A models did not return usable final content: ${unusableModels.join(', ')}`);
            }
