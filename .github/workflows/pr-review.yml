name: Reusable AI PR Review

# Centralized AI PR review used across repos via `uses:`. Repository policy is resolved
# from review-action/config/repositories/<owner>__<repo>.json. Callers expose only the
# fixed Lane A/B/C credential slots and never select models, providers, or fallbacks.

on:
  workflow_call:
    secrets:
      PR_AGENT_LANE_A_KEY:
        required: false
      PR_AGENT_LANE_A_API_BASE:
        required: false
      PR_AGENT_LANE_B_KEY:
        required: false
      PR_AGENT_LANE_B_API_BASE:
        required: false
      PR_AGENT_LANE_C_KEY:
        required: false
      PR_AGENT_LANE_C_API_BASE:
        required: false

jobs:
  ai-pr-review:
    # Put every trigger for the same PR in one latest-wins group. Automatic and manual
    # reviews update the same stable Lane comments, so a new trigger cancels the older run.
    concurrency:
      group: centralized-ai-pr-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Backstop only. Repository policy bounds each model independently and lanes run in
    # parallel. The public ci-central profile allows 32K reasoning-heavy Lane B responses,
    # including one same-Lane fallback, while this cap still prevents an unbounded runner.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out matching central configuration
        uses: actions/checkout@v5
        with:
          repository: TshyGO/ci-central
          # External callers resolve github.job_workflow_sha. The same-repository relative
          # caller can fall back to its own event SHA, which is safe only for ci-central.
          ref: ${{ github.job_workflow_sha || (github.repository == 'TshyGO/ci-central' && github.sha) }}
          path: .ci-central
          sparse-checkout: review-action

      - name: Resolve repository review configuration
        id: review-config
        uses: ./.ci-central/review-action
        with:
          repository: ${{ github.repository }}

      - name: Review pull request
        uses: actions/github-script@v8
        env:
          LANE_A_KEY: ${{ secrets.PR_AGENT_LANE_A_KEY }}
          LANE_A_API_BASE: ${{ secrets.PR_AGENT_LANE_A_API_BASE }}
          LANE_B_KEY: ${{ secrets.PR_AGENT_LANE_B_KEY }}
          LANE_B_API_BASE: ${{ secrets.PR_AGENT_LANE_B_API_BASE }}
          LANE_C_KEY: ${{ secrets.PR_AGENT_LANE_C_KEY }}
          LANE_C_API_BASE: ${{ secrets.PR_AGENT_LANE_C_API_BASE }}
          PR_REVIEW_CONFIG: ${{ steps.review-config.outputs.config }}
          PR_REVIEW_WORKFLOW_SHA: ${{ github.job_workflow_sha || (github.repository == 'TshyGO/ci-central' && github.sha) }}
        with:
          script: |
            const pullNumber = context.payload.pull_request?.number ?? context.payload.issue?.number;
            const { owner, repo } = context.repo;
            let reviewConfig;
            try {
              reviewConfig = JSON.parse(process.env.PR_REVIEW_CONFIG || '');
            } catch (error) {
              throw new Error(`Central PR review config is invalid JSON: ${error.message}`);
            }
            if (reviewConfig.repository !== `${owner}/${repo}` || !Array.isArray(reviewConfig.lanes) || reviewConfig.lanes.length === 0) {
              throw new Error(`Central PR review config does not match ${owner}/${repo}.`);
            }
            const workflowSha = (process.env.PR_REVIEW_WORKFLOW_SHA || '').trim().toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(workflowSha)) {
              throw new Error('github.job_workflow_sha must provide the full 40-character reusable workflow commit SHA.');
            }
            const lanes = reviewConfig.lanes;
            const reviewPolicy = reviewConfig.review_policy || {};
            if (typeof reviewPolicy.system_prompt !== 'string' || !reviewPolicy.system_prompt.trim()) {
              throw new Error('Central PR review config is missing review_policy.system_prompt.');
            }
            const laneCredentials = {
              A: {
                apiKey: process.env.LANE_A_KEY,
                baseUrl: (process.env.LANE_A_API_BASE || '').replace(/\/$/, ''),
              },
              B: {
                apiKey: process.env.LANE_B_KEY,
                baseUrl: (process.env.LANE_B_API_BASE || '').replace(/\/$/, ''),
              },
              C: {
                apiKey: process.env.LANE_C_KEY,
                baseUrl: (process.env.LANE_C_API_BASE || (process.env.LANE_C_KEY ? 'https://generativelanguage.googleapis.com/v1beta' : '')).replace(/\/$/, ''),
              },
            };
            for (const lane of lanes) {
              if (!Array.isArray(lane.fallbacks)) {
                throw new Error(`Lane ${lane.id} fallbacks must be an array.`);
              }
              const chain = [lane.primary, ...lane.fallbacks];
              if (!lane.primary || chain.some((model) => !model?.id || !model?.label)) {
                throw new Error(`Lane ${lane.id} has an invalid primary or fallback model.`);
              }
              if (new Set(chain.map((model) => model.id)).size !== chain.length) {
                throw new Error(`Lane ${lane.id} contains a duplicate primary/fallback model id.`);
              }
              if (lane.review_prompt_suffix !== undefined
                  && (typeof lane.review_prompt_suffix !== 'string' || !lane.review_prompt_suffix.trim())) {
                throw new Error(`Lane ${lane.id} review_prompt_suffix must be a non-empty string when configured.`);
              }
              for (const model of chain) {
                if (model.thinking_level === undefined) continue;
                if (lane.protocol !== 'google-generate-content') {
                  throw new Error(`Lane ${lane.id}/${model.id} thinking_level is only supported by google-generate-content.`);
                }
                if (!['minimal', 'low', 'medium', 'high'].includes(model.thinking_level)) {
                  throw new Error(`Lane ${lane.id}/${model.id} thinking_level is not supported.`);
                }
              }
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            // A newer push may already have superseded this pull_request event before the
            // reusable job starts. Never spend model tokens reviewing a stale commit.
            const eventHeadSha = context.payload.pull_request?.head?.sha;
            const reviewHeadSha = pull.head.sha;
            if (eventHeadSha && eventHeadSha !== reviewHeadSha) {
              console.log(`Skip stale review before context collection: event=${eventHeadSha.slice(0, 7)} current=${reviewHeadSha.slice(0, 7)}.`);
              return;
            }

            // A bot comment is reusable only when its machine-readable evidence proves that
            // this exact Lane completed a valid review for both the current PR head and the
            // current reusable-workflow revision. Legacy, diagnostic, partial, edited, or
            // previous-workflow comments are deliberately not reusable.
            const existingComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const evidencePattern = /<!-- ai-pr-review-evidence:v2 lane=([A-C]) head=([0-9a-f]{40}) workflow=([0-9a-f]{40}) status=(valid|diagnostic|partial) -->/i;
            const reusableLaneIds = new Set();
            for (const lane of lanes) {
              const stableMarker = `<!-- ai-pr-review-bot:lane-${lane.id} -->`;
              const laneComments = existingComments.filter((comment) =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.includes(stableMarker));
              // Duplicate stable comments are not a trustworthy freeze artifact. Force this
              // Lane to run so the normal publish path keeps the newest comment and removes
              // every older duplicate before evidence can be reused.
              if (laneComments.length !== 1) {
                if (laneComments.length > 1) {
                  console.log(`Lane ${lane.id} has ${laneComments.length} stable comments; forcing a rerun to reconcile duplicates.`);
                }
                continue;
              }
              const evidence = evidencePattern.exec(laneComments[0].body || '');
              if (!evidence) continue;
              const [, laneId, headSha, evidenceWorkflowSha, status] = evidence;
              if (laneId.toUpperCase() === lane.id
                  && headSha.toLowerCase() === reviewHeadSha.toLowerCase()
                  && evidenceWorkflowSha.toLowerCase() === workflowSha
                  && status.toLowerCase() === 'valid') {
                reusableLaneIds.add(lane.id);
              }
            }
            const isManualReview = context.eventName === 'issue_comment';
            const lanesToReview = isManualReview
              ? lanes
              : lanes.filter((lane) => !reusableLaneIds.has(lane.id));
            if (reusableLaneIds.size) {
              console.log(`Reusable valid review evidence for ${reviewHeadSha.slice(0, 7)}: ${[...reusableLaneIds].sort().map((lane) => `Lane ${lane}`).join(', ')}.`);
            }
            if (lanesToReview.length === 0) {
              const { data: dedupePull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              });
              if (dedupePull.head.sha !== reviewHeadSha || dedupePull.state !== 'open') {
                console.log(`Skip stale evidence reuse: reviewed=${reviewHeadSha.slice(0, 7)} current=${dedupePull.head.sha.slice(0, 7)} state=${dedupePull.state || 'unknown'}.`);
                return;
              }
              console.log(`All configured Lanes already have valid review evidence for head ${reviewHeadSha} at workflow ${workflowSha}; skipping model requests.`);
              return;
            }
            if (isManualReview) {
              console.log('Manual /review bypasses same-HEAD evidence reuse and forces every configured Lane to run.');
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            // Collect every issue referenced (#N) in the PR title, body and commit messages
            const issueRefPattern = /#(\d+)/g;
            const issueSources = [pull.title || '', pull.body || ''];
            const prCommits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            for (const c of prCommits) issueSources.push(c.commit?.message || '');
            const issueNumbers = [...new Set(
              issueSources.flatMap((t) => [...t.matchAll(issueRefPattern)].map((m) => Number(m[1])))
            )].slice(0, 10);
            let issueContext = '';
            for (const num of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: num });
                if (issue.pull_request) continue;
                issueContext += `\n### Issue #${num}: ${issue.title}\n${(issue.body || '').slice(0, 2000)}\n`;
              } catch (error) {
                console.log(`Skip referenced issue #${num}: ${error.message}`);
              }
            }

            // Pack whole file patches until the budget is spent, so a review never sees a
            // patch cut off mid-hunk. Tests go last: when something has to be dropped it
            // should be the tests, not the source they cover.
            const DIFF_BUDGET = Math.max(4000, Number(reviewPolicy.diff_char_budget) || 100000);
            const SEPARATOR = '\n\n---\n\n';
            const TRUNCATION_NOTE = '\n[... patch truncated to fit the diff budget ...]';
            const isTestFile = (name) => /(^|\/)(tests?|__tests__|__mocks__)\//.test(name)
              || /\.(test|spec)\.[cm]?[jt]sx?$/.test(name)
              || /(^|\/)test_[^/]+\.py$/.test(name)
              || /_test\.(go|py|rs)$/.test(name);
            const orderedFiles = [...files].sort(
              (a, b) => Number(isTestFile(a.filename)) - Number(isTestFile(b.filename))
            );

            function packDiff(budget) {
              const keptBlocks = [];
              const omittedFiles = [];
              let usedChars = 0;
              for (const file of orderedFiles) {
                const patch = file.patch || '[binary or patch unavailable]';
                const block = [
                  `File: ${file.filename}`,
                  `Status: ${file.status}; +${file.additions} -${file.deletions}`,
                  patch,
                ].join('\n');
                const separatorCost = keptBlocks.length ? SEPARATOR.length : 0;
                const remaining = budget - usedChars - separatorCost;
                if (block.length <= remaining) {
                  keptBlocks.push(block);
                  usedChars += block.length + separatorCost;
                } else if (remaining > TRUNCATION_NOTE.length + 400) {
                  keptBlocks.push(block.slice(0, remaining - TRUNCATION_NOTE.length) + TRUNCATION_NOTE);
                  usedChars = budget;
                } else {
                  omittedFiles.push(file.filename);
                }
              }
              let text = keptBlocks.join(SEPARATOR);
              const packedChars = text.length;
              if (omittedFiles.length) {
                // The budget governs patch text; this note is bounded metadata on top of it.
                const shown = omittedFiles.slice(0, 20).join(', ');
                const names = shown.length > 400 ? `${shown.slice(0, 400)}…` : shown;
                const more = omittedFiles.length > 20 ? ` (+${omittedFiles.length - 20} more)` : '';
                text += `\n\n[${omittedFiles.length} file(s) omitted to fit the ${budget}-character patch budget: ${names}${more}]`;
              }
              return { text, kept: keptBlocks.length, packedChars, omitted: omittedFiles.length };
            }

            const diffPack = packDiff(DIFF_BUDGET);
            console.log(`Diff packed: ${diffPack.kept}/${files.length} files, ${diffPack.packedChars}/${DIFF_BUDGET} patch chars, ${diffPack.omitted} omitted.`);

            // Kimi K3 is useful as a last-resort reviewer but can spend a large context and
            // completion budget entirely on reasoning. Preserve the proven bounded prompt:
            // complete file inventory plus a small representative patch sample.
            const kimiK3Pack = packDiff(1000);
            const fileList = files.map((file) => `${file.filename} (${file.status}, +${file.additions} -${file.deletions})`).join('\n');

            const system = reviewPolicy.system_prompt;
            const kimiK3System = `${system} Focus on high-confidence, high-impact findings supported by the supplied file inventory and patch sample.`;
            const laneSystem = (lane) => lane.review_prompt_suffix
              ? `${system}\n\n${lane.review_prompt_suffix}`
              : system;

            const buildUser = (diffText, options = {}) => [
              `Repository: ${owner}/${repo}`,
              `Pull Request: #${pull.number} ${pull.title}`,
              `Author: ${pull.user.login}`,
              `Base: ${pull.base.ref}`,
              `Head: ${pull.head.ref}`,
              '',
              'PR description:',
              (pull.body || '[No description]').slice(0, options.descriptionLimit ?? 4000),
              '',
              (options.issueText ?? issueContext)
                ? `Referenced issues (background — what & why):\n${options.issueText ?? issueContext}`
                : 'Referenced issues: none.',
              '',
              ...(options.fileList ? ['All changed file names:', options.fileList, ''] : []),
              'Changed files and patches:',
              diffText || '[No diff available]',
            ].join('\n');
            const user = buildUser(diffPack.text);
            const kimiK3User = buildUser(kimiK3Pack.text, {
              descriptionLimit: 2000,
              issueText: issueContext.slice(0, 2000),
              fileList,
            });

            // Model ids are scoped to a lane, never globally. The same model id may be routed
            // through two providers without changing credentials or fallback ownership.
            const maxAttempts = Number(reviewPolicy.max_attempts) || 3;
            // A healthy response with heavy reasoning has been observed at ~270s. The default
            // request window is 5 minutes; repository policy may raise it for a larger output
            // ceiling (ci-central Lane B uses 10 minutes). MODEL_BUDGET_MS remains the hard
            // per-model wall-clock cap for retries and field-repair loops.
            const requestTimeoutMs = Number(reviewPolicy.request_timeout_ms) || 300000;
            const MODEL_BUDGET_MS = Number(reviewPolicy.model_budget_ms) || 360000;

            // Some upstreams (e.g. MiniMax) inline their chain-of-thought into `content`
            // instead of `reasoning_content`. Never let that reach the PR comment.
            function stripThinking(text) {
              if (!text) return '';
              return text
                .replace(/<think>[\s\S]*?<\/think>/gi, '')
                .replace(/<\/?think>/gi, '')
                .trim();
            }

            // Optional request fields an upstream may reject outright. Dropping one and
            // retrying is always safe; `model`/`messages`/`stream` never are.
            const DROPPABLE_FIELDS = new Set([
              'enable_thinking', 'temperature', 'top_p', 'max_tokens', 'max_output_tokens',
            ]);
            const EXTRA_FIELD_REJECTED = [
              /Extra inputs are not permitted, field: '([^']+)'/i,
              /unknown field:? '?([a-z_]+)'?/i,
              /unsupported parameter:? '?([a-z_]+)'?/i,
            ];

            function basePayload(model) {
              const throttled = model.context_profile === 'kimi-k3-throttled';
              const messages = [
                { role: 'system', content: throttled ? kimiK3System : system },
                { role: 'user', content: throttled ? kimiK3User : user },
              ];
              const payload = {
                model: model.id,
                messages,
                stream: false,
                max_tokens: model.max_output_tokens,
              };
              if (Number.isFinite(model.temperature)) payload.temperature = model.temperature;
              return payload;
            }

            function googlePayload(lane, model) {
              const throttled = model.context_profile === 'kimi-k3-throttled';
              const generationConfig = { maxOutputTokens: model.max_output_tokens };
              if (model.thinking_level) {
                generationConfig.thinkingConfig = {
                  thinkingLevel: model.thinking_level.toUpperCase(),
                };
              }
              return {
                systemInstruction: { parts: [{ text: throttled ? kimiK3System : laneSystem(lane) }] },
                contents: [{ role: 'user', parts: [{ text: throttled ? kimiK3User : user }] }],
                generationConfig,
              };
            }

            function classifyFailure(response, responseText, requestError) {
              const status = response?.status;
              const rawText = `${responseText || ''}\n${requestError || ''}`;
              const text = rawText.toLowerCase();
              const quotaExhausted = status === 429 && (
                text.includes('insufficient_quota')
                || /token[- ]?plan[^\n]*quota[^\n]*(exhausted|reached)/i.test(text)
                || /weekly[^\n]*quota[^\n]*(exhausted|reached)/i.test(text)
                || /quota[^\n]*reset at/i.test(text)
              );
              const authenticationFailed = status === 401 || (
                status === 403
                && /(invalid[_ -]?api[_ -]?key|authentication|unauthori[sz]ed)/i.test(text)
              );
              const gatewayBlocked = /^\s*(<!doctype html|<html\b)/i.test(responseText || '')
                || (!response?.ok && text.includes('验证失败'));
              const endpointUnavailable = !response && (
                /fetch failed|enotfound|eai_again|getaddrinfo|econnrefused|certificate|\btls\b/i.test(text)
              );

              if (quotaExhausted) return { kind: 'quota-exhausted', stopRetries: true, stopFallbacks: true };
              if (authenticationFailed) return { kind: 'authentication-failed', stopRetries: true, stopFallbacks: true };
              if (gatewayBlocked) return { kind: 'gateway-blocked', stopRetries: true, stopFallbacks: true };
              if (endpointUnavailable) return { kind: 'endpoint-unavailable', stopRetries: false, stopFallbacks: true };
              return { kind: 'model-or-upstream-failure', stopRetries: false, stopFallbacks: false };
            }

            async function callOnce(lane, model, payload, deadline) {
              const modelId = model.id;
              const requestBody = JSON.stringify(
                lane.protocol === 'google-generate-content' ? googlePayload(lane, model) : payload
              );
              let response;
              let responseText = '';
              let requestError = '';
              let failureKind = '';
              let stopFallbacks = false;
              let attempts = 0;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                attempts = attempt;
                response = undefined;
                responseText = '';
                requestError = '';
                // Never let a single attempt run past the model's wall-clock budget: cap it to
                // whatever time is left, and give up rather than starting an attempt with none.
                const remaining = deadline - Date.now();
                if (remaining <= 0) {
                  requestError = `Gave up on ${modelId} after its ${MODEL_BUDGET_MS / 1000}s budget was exhausted (upstream likely hung).`;
                  console.log(`[Lane ${lane.id}/${modelId}] attempt ${attempt}/${maxAttempts} skipped: model budget exhausted`);
                  break;
                }
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), Math.min(requestTimeoutMs, remaining));
                try {
                  const credentials = laneCredentials[lane.id];
                  const isGoogle = lane.protocol === 'google-generate-content';
                  const endpoint = isGoogle
                    ? `${credentials.baseUrl}/models/${encodeURIComponent(modelId)}:generateContent`
                    : `${credentials.baseUrl}/chat/completions`;
                  response = await fetch(endpoint, {
                    method: 'POST',
                    signal: controller.signal,
                    headers: isGoogle ? {
                      'x-goog-api-key': credentials.apiKey,
                      'content-type': 'application/json',
                      accept: 'application/json',
                      'user-agent': 'GitHubActions-AI-PR-Review',
                    } : {
                      authorization: `Bearer ${credentials.apiKey}`,
                      'content-type': 'application/json',
                      accept: 'application/json',
                      'user-agent': 'GitHubActions-AI-PR-Review',
                    },
                    body: requestBody,
                  });
                  responseText = await response.text();
                } catch (error) {
                  requestError = error?.name === 'AbortError'
                    ? 'AI endpoint request aborted (per-attempt timeout or model budget reached).'
                    : (error?.message || String(error));
                } finally {
                  clearTimeout(timeout);
                }
                const failure = classifyFailure(response, responseText, requestError);
                if (response?.ok && failure.kind !== 'gateway-blocked') break;
                const status = response?.status ?? 'request failed';
                const diag = (responseText || requestError || '').slice(0, 1000);
                console.log(`[Lane ${lane.id}/${modelId}] provider=${lane.provider} protocol=${lane.protocol} attempt ${attempt}/${maxAttempts} failed: status=${status} body=${diag}`);
                failureKind = failure.kind;
                stopFallbacks = failure.stopFallbacks;
                // Retry transient failures only (5xx, 429, network/timeout); other 4xx are
                // request/auth problems that will not fix themselves on retry.
                const retriable = !response || response.status >= 500 || response.status === 429;
                if (failure.stopRetries || !retriable || attempt === maxAttempts) break;
                // Exponential backoff with jitter (~3s, ~9s): rides out short upstream blips.
                // Skip the wait entirely if it would eat into the budget — better to spend the
                // remaining time on a real attempt (or on the fallback) than on sleeping.
                const backoff = 3000 * Math.pow(3, attempt - 1) + Math.floor(Math.random() * 1000);
                if (Date.now() + backoff >= deadline) break;
                await new Promise((resolve) => setTimeout(resolve, backoff));
              }
              if (response?.ok && !failureKind) {
                return { response, responseText, requestError, attempts, failureKind: '', stopFallbacks: false };
              }
              return { response, responseText, requestError, attempts, failureKind, stopFallbacks };
            }

            // The gateway silently re-routes a model between upstreams, and upstreams disagree
            // about which optional fields exist. When one rejects a field by name, drop it and
            // retry rather than losing the whole review.
            async function callModel(lane, model) {
              // One budget per model covers all its attempts and field-repair retries. Each
              // model in a fallback chain gets a fresh budget, so a hung primary is abandoned
              // in bounded time and the fallback still gets its own full window.
              const deadline = Date.now() + MODEL_BUDGET_MS;
              if (lane.protocol === 'google-generate-content') {
                return callOnce(lane, model, null, deadline);
              }
              const payload = basePayload(model);
              for (let repair = 0; repair <= DROPPABLE_FIELDS.size; repair++) {
                const result = await callOnce(lane, model, payload, deadline);
                if (result.response?.status !== 400) return result;
                const text = result.responseText || '';
                const matched = EXTRA_FIELD_REJECTED.map((re) => re.exec(text)).find(Boolean);
                const field = matched?.[1];
                if (!field || !DROPPABLE_FIELDS.has(field) || !(field in payload)) return result;
                console.log(`[Lane ${lane.id}/${model.id}] upstream rejected optional field '${field}'; dropping it and retrying.`);
                delete payload[field];
              }
              return callOnce(lane, model, payload, deadline);
            }

            function extractReview(lane, model, responseText) {
              const payload = JSON.parse(responseText);
              if (lane.protocol === 'google-generate-content') {
                const candidate = payload?.candidates?.[0];
                const parts = Array.isArray(candidate?.content?.parts) ? candidate.content.parts : [];
                const content = stripThinking(parts
                  .filter((part) => part?.thought !== true)
                  .map((part) => part?.text || '')
                  .join('\n'));
                const finishReason = candidate?.finishReason;
                const normalizedFinishReason = typeof finishReason === 'string' ? finishReason.toLowerCase() : '';
                const usage = payload?.usageMetadata || {};
                const explicitThoughtTokens = Number(usage.thoughtsTokenCount);
                const derivedThoughtTokens = Number(usage.totalTokenCount)
                  - Number(usage.promptTokenCount)
                  - Number(usage.candidatesTokenCount);
                const hasExplicitThoughtTokens = Number.isFinite(explicitThoughtTokens);
                const hasDerivedThoughtTokens = Number.isFinite(derivedThoughtTokens) && derivedThoughtTokens >= 0;
                const reasoningLength = hasExplicitThoughtTokens
                  ? explicitThoughtTokens
                  : (hasDerivedThoughtTokens ? derivedThoughtTokens : 0);
                const reasoningUnit = hasExplicitThoughtTokens || hasDerivedThoughtTokens ? 'tokens' : null;
                console.log(`[Lane ${lane.id}/${model.id}] api=generateContent finish_reason=${finishReason} contentLen=${content.length} thoughtTokens=${reasoningUnit ? reasoningLength : 'not-reported'} usage=${JSON.stringify(usage)}`);
                let review = content;
                if (review && normalizedFinishReason && normalizedFinishReason !== 'stop') {
                  review += '\n\n> ⚠️ 模型输出未完整结束，这条 review 可能不完整。';
                }
                return { review, reasoningLength, reasoningUnit, complete: !normalizedFinishReason || normalizedFinishReason === 'stop' };
              }
              const choice = payload?.choices?.[0];
              const message = choice?.message;
              const finishReason = choice?.finish_reason;
              const normalizedFinishReason = typeof finishReason === 'string' ? finishReason.toLowerCase() : '';
              const reasoning = message?.reasoning_content || '';
              const content = stripThinking(message?.content);
              // Never publish provider reasoning as a review. An empty final response makes
              // the caller continue to its configured fallback instead.
              let review = content;
              console.log(`[Lane ${lane.id}/${model.id}] api=chat/completions upstream=${payload?.model} finish_reason=${finishReason} contentLen=${message?.content?.length || 0} reasoningLen=${reasoning.length} usage=${JSON.stringify(payload?.usage)}`);
              if (review && normalizedFinishReason === 'length') {
                review += '\n\n> ⚠️ 模型输出达到 max_tokens 上限，这条 review 可能不完整。';
              }
              return { review, reasoningLength: reasoning.length, reasoningUnit: 'chars', complete: !normalizedFinishReason || normalizedFinishReason === 'stop' };
            }

            // Try the primary model, then same-provider fallbacks. Shared provider failures
            // short-circuit the lane so the full context is not resent to the same endpoint.
            async function requestReview(lane) {
              const primary = lane.primary;
              const chain = [primary, ...lane.fallbacks];
              const credentials = laneCredentials[lane.id];
              if (!credentials?.apiKey || !credentials?.baseUrl) {
                console.log(`[Lane ${lane.id}] fixed credential slots are not available; skipping model requests for this lane.`);
                return {
                  lane,
                  primary,
                  servedBy: null,
                  reasoningLength: 0,
                  degraded: false,
                  status: 'diagnostic',
                  review: [
                    '> AI review was not generated.',
                    '',
                    `Lane ${lane.id} is not provisioned.`,
                    '',
                    `Action needed: set PR_AGENT_LANE_${lane.id}_KEY and PR_AGENT_LANE_${lane.id}_API_BASE in the caller repository.`,
                  ].join('\n'),
                };
              }
              const tried = [];
              let lastResponse;
              let lastResponseText = '';
              let lastRequestError = '';
              let lastFailureKind = '';
              let stoppedSharedLane = false;

              for (const model of chain) {
                const { response, responseText, requestError, attempts, failureKind, stopFallbacks } = await callModel(lane, model);
                lastResponse = response;
                lastResponseText = responseText;
                lastRequestError = requestError;
                lastFailureKind = failureKind;
                if (response?.ok) {
                  try {
                    const { review, reasoningLength, reasoningUnit, complete } = extractReview(lane, model, responseText);
                    if (review) {
                      return {
                        lane,
                        primary,
                        servedBy: model,
                        review,
                        reasoningLength,
                        reasoningUnit,
                        degraded: model !== primary,
                        status: complete ? 'valid' : 'partial',
                      };
                    }
                    console.log(`[Lane ${lane.id}/${model.id}] response parsed but contained no review text.`);
                  } catch (error) {
                    console.log(`[Lane ${lane.id}/${model.id}] parse error: ${error?.message || error}`);
                  }
                }
                tried.push(`${model.id} -> HTTP ${response?.status ?? 'request failed'} (${attempts ?? 0} attempt(s))`);
                if (stopFallbacks && model !== chain[chain.length - 1]) {
                  stoppedSharedLane = true;
                  console.log(`[Lane ${lane.id}/${primary.id}] ${failureKind} affects provider ${lane.provider}; skipping fallback requests in this lane.`);
                  break;
                }
                if (model !== chain[chain.length - 1]) {
                  console.log(`[Lane ${lane.id}/${primary.id}] falling back to the next model in the lane.`);
                }
              }

              const failText = (lastResponseText || lastRequestError || '').trim();
              const gatewayBlocked = lastFailureKind === 'gateway-blocked';
              const upstreamExhausted = failText.includes('failover_exhausted');
              const status = lastResponse?.status ?? 'request failed';
              const isServerSide = typeof status === 'number' && status >= 500;
              const stoppedSummary = stoppedSharedLane
                ? `The failure applies to the shared Lane ${lane.id} ${lane.provider} endpoint, so this lane's fallbacks were skipped to avoid duplicate requests. Reason: ${lastFailureKind}.`
                : `Review attempts did not produce a usable response. Tried: ${tried.join('; ')}.`;
              const fence = '```';
              const snippet = failText.replace(/`/g, "'").slice(0, 600);
              const review = [
                '> AI review was not generated.',
                '',
                gatewayBlocked
                  ? 'GitHub Actions reached the configured API endpoint, but the gateway returned an HTML verification page instead of JSON.'
                  : stoppedSummary,
                '',
                snippet
                  ? `<details><summary>Upstream response (truncated)</summary>\n\n${fence}\n${snippet}\n${fence}\n</details>`
                  : '',
                '',
                gatewayBlocked
                  ? 'Action needed: use an API base URL that GitHub-hosted runners can reach without browser verification, or run this workflow on a self-hosted runner.'
                  : lastFailureKind === 'quota-exhausted'
                    ? 'Action needed: the shared Token Plan quota is exhausted. Wait for its reset or replenish it; retrying another model on the same plan cannot recover the review.'
                    : lastFailureKind === 'authentication-failed'
                      ? `Action needed: repair Lane ${lane.id} credentials or authentication configuration.`
                      : lastFailureKind === 'endpoint-unavailable'
                        ? `Action needed: Lane ${lane.id} endpoint remained unreachable after retries. Models sharing that Lane cannot bypass its network failure.`
                  : upstreamExhausted
                    ? `Action needed: \`failover_exhausted\` means Lane ${lane.id} ran out of healthy upstreams. Inspect its central repository config and provider health; do not add a cross-lane fallback.`
                    : isServerSide
                      ? 'Action needed: a 5xx originates from the model gateway/account, not from GitHub access. Check the upstream response above — most often quota/balance exhausted, an invalid or expired key, a wrong model name, or a provider-side outage.'
                      : 'Action needed: inspect the upstream response above to identify the request or auth problem.',
              ].join('\n');

              return { lane, primary, servedBy: null, review, reasoningLength: 0, degraded: false, status: 'diagnostic' };
            }

            // Context collection can take long enough for another push to land. Re-read the
            // head immediately before dispatch so neither full-context reviewer spends tokens
            // on a commit that is no longer current.
            const { data: latestPull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (latestPull.head.sha !== reviewHeadSha || (latestPull.state && latestPull.state !== 'open')) {
              console.log(`Skip stale review before model dispatch: prepared=${reviewHeadSha.slice(0, 7)} current=${latestPull.head.sha.slice(0, 7)} state=${latestPull.state || 'unknown'}.`);
              return;
            }

            const headSha = reviewHeadSha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // Run lanes independently in parallel. A healthy lane emits exactly one comment;
            // fallbacks are sequential inside that lane and can never cross credentials.
            const settled = await Promise.allSettled(lanesToReview.map((lane) => requestReview(lane)));

            // Model calls can outlive the commit they reviewed. Do not attach completed
            // results to a newer head (or to a PR that was closed while they were running).
            const { data: publishPull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (publishPull.head.sha !== reviewHeadSha || publishPull.state !== 'open') {
              console.log(`Skip stale review before comment publishing: reviewed=${reviewHeadSha.slice(0, 7)} current=${publishPull.head.sha.slice(0, 7)} state=${publishPull.state || 'unknown'}.`);
              return;
            }

            let posted = 0;
            const validLaneIds = new Set(isManualReview ? [] : reusableLaneIds);
            for (let i = 0; i < settled.length; i++) {
              const lane = lanesToReview[i];
              const primary = lane.primary;
              if (settled[i].status === 'rejected') {
                console.log(`[Lane ${lane.id}/${primary.id}] review pipeline threw: ${settled[i].reason?.message || settled[i].reason}`);
                continue;
              }
              const { servedBy, review, reasoningLength, reasoningUnit, degraded, status } = settled[i].value;
              const modelLine = degraded
                ? `Lane ${lane.id}: ${primary.id} unavailable -> served by ${servedBy.id}`
                : `Lane ${lane.id}: ${servedBy?.id ?? primary.id}`;
              const banner = degraded
                ? [`> ℹ️ Lane ${lane.id} 的 \`${primary.label}\` 当前不可用，本条 review 由同通道备用模型 \`${servedBy.label}\` 生成。`, '']
                : [];
              const body = [
                `<!-- ai-pr-review-bot:lane-${lane.id} -->`,
                `<!-- ai-pr-review-evidence:v2 lane=${lane.id} head=${reviewHeadSha} workflow=${workflowSha} status=${status} -->`,
                `## AI PR Review · Lane ${lane.id} · ${primary.label}`,
                '',
                ...banner,
                review,
                '',
                `<sub>${modelLine} · Thinking: ${reasoningUnit ? `${reasoningLength} ${reasoningUnit}` : 'not reported'} · Commit: ${headSha} · [Run](${runUrl})</sub>`,
              ].join('\n');
              try {
                const marker = `<!-- ai-pr-review-bot:lane-${lane.id} -->`;
                const priorLaneComments = existingComments.filter((comment) =>
                  comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
                const currentComment = priorLaneComments.at(-1);
                let publishedComment;
                if (currentComment) {
                  ({ data: publishedComment } = await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: currentComment.id,
                    body,
                  }));
                } else {
                  ({ data: publishedComment } = await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: pullNumber,
                    body,
                  }));
                }
                for (const duplicate of priorLaneComments.slice(0, -1)) {
                  try {
                    await github.rest.issues.deleteComment({ owner, repo, comment_id: duplicate.id });
                  } catch (cleanupError) {
                    console.log(`Failed to remove duplicate Lane ${lane.id} comment ${duplicate.id}: ${cleanupError?.message || cleanupError}`);
                  }
                }
                posted++;
                if (status === 'valid') validLaneIds.add(lane.id);
                console.log(`${currentComment ? 'Updated' : 'Created'} AI PR Review comment ${publishedComment.id} for Lane ${lane.id} with status=${status}.`);
              } catch (error) {
                // One failed comment must not swallow the others.
                console.log(`Failed to post comment for Lane ${lane.id}: ${error?.message || error}`);
              }
            }
            if (posted === 0) {
              throw new Error('No AI PR Review comment could be posted for any configured model.');
            }
            const invalidLaneIds = lanes
              .map((lane) => lane.id)
              .filter((laneId) => !validLaneIds.has(laneId));
            if (invalidLaneIds.length) {
              throw new Error(`Required review evidence is not valid for ${invalidLaneIds.map((laneId) => `Lane ${laneId}`).join(', ')} at head ${reviewHeadSha}.`);
            }
