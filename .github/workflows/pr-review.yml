name: Reusable AI PR Review

# Centralized AI PR review used across repos via `uses:`.
# Swap provider/model in ONE place: change the `models` default below
# (or pass `with: models`), and update the caller repository secrets.
#
# Current default: one Alibaba Cloud lane and one independent Google lane. The Alibaba
# lane uses GLM-5.2 as its only primary, with Qwen3.8-Max tried only when GLM fails.
# Gemini 3.7 Flash remains an
# independent primary through Google AI Studio's generateContent protocol.
# The job never publishes provider reasoning.

on:
  workflow_call:
    inputs:
      models:
        description: Comma-separated model ids to run in parallel.
        type: string
        required: false
        default: "glm-5.2,gemini-3.7-flash"
      model_labels:
        description: JSON map of model id -> display label.
        type: string
        required: false
        default: '{"glm-5.2":"GLM-5.2","qwen3.8-max":"Qwen3.8-Max","gemini-3.7-flash":"Gemini-3.7-Flash"}'
      fallbacks:
        description: JSON map of model id -> ordered fallback model ids, tried when the primary keeps failing.
        type: string
        required: false
        default: '{"glm-5.2":["qwen3.8-max"]}'
      model_providers:
        description: JSON map of model id -> provider id. A fallback must use the same provider as its primary.
        type: string
        required: false
        default: '{"glm-5.2":"alibaba","qwen3.8-max":"alibaba","gemini-3.7-flash":"google"}'
      diff_char_budget:
        description: Max characters of patch text sent to the model. Whole files are packed in order; test files are packed last so they are dropped first.
        type: number
        required: false
        default: 100000
    secrets:
      PR_AGENT_OPENAI_KEY:
        required: true
      PR_AGENT_OPENAI_API_BASE:
        required: true
      PR_AGENT_GOOGLE_AI_KEY:
        required: false
      PR_AGENT_TENCENT_KEY:
        required: false
      PR_AGENT_TENCENT_API_BASE:
        required: false

jobs:
  ai-pr-review:
    # Enforce latest-commit-wins centrally even when a thin caller forgot to enable
    # cancellation. Keep manual /review comments isolated from pull_request pushes.
    concurrency:
      group: centralized-ai-pr-review-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Backstop only. The script bounds each model with MODEL_BUDGET_MS (~6 min) and runs
    # models in parallel, so a real run finishes in a few minutes; this just guarantees a
    # hung upstream can never hold a runner the way one 26-minute job did.
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Review pull request
        uses: actions/github-script@v8
        env:
          OPENAI_API_KEY: ${{ secrets.PR_AGENT_OPENAI_KEY }}
          OPENAI_API_BASE: ${{ secrets.PR_AGENT_OPENAI_API_BASE }}
          GOOGLE_AI_API_KEY: ${{ secrets.PR_AGENT_GOOGLE_AI_KEY }}
          TENCENT_API_KEY: ${{ secrets.PR_AGENT_TENCENT_KEY }}
          TENCENT_API_BASE: ${{ secrets.PR_AGENT_TENCENT_API_BASE }}
          PR_REVIEW_MODELS: ${{ inputs.models }}
          PR_REVIEW_MODEL_LABELS: ${{ inputs.model_labels }}
          PR_REVIEW_FALLBACKS: ${{ inputs.fallbacks }}
          PR_REVIEW_MODEL_PROVIDERS: ${{ inputs.model_providers }}
          PR_REVIEW_DIFF_BUDGET: ${{ inputs.diff_char_budget }}
        with:
          script: |
            const pullNumber = context.payload.pull_request?.number ?? context.payload.issue?.number;
            const { owner, repo } = context.repo;

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            // A newer push may already have superseded this pull_request event before the
            // reusable job starts. Never spend model tokens reviewing a stale commit.
            const eventHeadSha = context.payload.pull_request?.head?.sha;
            const reviewHeadSha = pull.head.sha;
            if (eventHeadSha && eventHeadSha !== reviewHeadSha) {
              console.log(`Skip stale review before context collection: event=${eventHeadSha.slice(0, 7)} current=${reviewHeadSha.slice(0, 7)}.`);
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            // Collect every issue referenced (#N) in the PR title, body and commit messages
            const issueRefPattern = /#(\d+)/g;
            const issueSources = [pull.title || '', pull.body || ''];
            const prCommits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            for (const c of prCommits) issueSources.push(c.commit?.message || '');
            const issueNumbers = [...new Set(
              issueSources.flatMap((t) => [...t.matchAll(issueRefPattern)].map((m) => Number(m[1])))
            )].slice(0, 10);
            let issueContext = '';
            for (const num of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: num });
                if (issue.pull_request) continue;
                issueContext += `\n### Issue #${num}: ${issue.title}\n${(issue.body || '').slice(0, 2000)}\n`;
              } catch (error) {
                console.log(`Skip referenced issue #${num}: ${error.message}`);
              }
            }

            // Pack whole file patches until the budget is spent, so a review never sees a
            // patch cut off mid-hunk. Tests go last: when something has to be dropped it
            // should be the tests, not the source they cover.
            const DIFF_BUDGET = Math.max(4000, Number(process.env.PR_REVIEW_DIFF_BUDGET) || 100000);
            const SEPARATOR = '\n\n---\n\n';
            const TRUNCATION_NOTE = '\n[... patch truncated to fit the diff budget ...]';
            const isTestFile = (name) => /(^|\/)(tests?|__tests__|__mocks__)\//.test(name)
              || /\.(test|spec)\.[cm]?[jt]sx?$/.test(name)
              || /(^|\/)test_[^/]+\.py$/.test(name)
              || /_test\.(go|py|rs)$/.test(name);
            const orderedFiles = [...files].sort(
              (a, b) => Number(isTestFile(a.filename)) - Number(isTestFile(b.filename))
            );

            function packDiff(budget) {
              const keptBlocks = [];
              const omittedFiles = [];
              let usedChars = 0;
              for (const file of orderedFiles) {
                const patch = file.patch || '[binary or patch unavailable]';
                const block = [
                  `File: ${file.filename}`,
                  `Status: ${file.status}; +${file.additions} -${file.deletions}`,
                  patch,
                ].join('\n');
                const separatorCost = keptBlocks.length ? SEPARATOR.length : 0;
                const remaining = budget - usedChars - separatorCost;
                if (block.length <= remaining) {
                  keptBlocks.push(block);
                  usedChars += block.length + separatorCost;
                } else if (remaining > TRUNCATION_NOTE.length + 400) {
                  keptBlocks.push(block.slice(0, remaining - TRUNCATION_NOTE.length) + TRUNCATION_NOTE);
                  usedChars = budget;
                } else {
                  omittedFiles.push(file.filename);
                }
              }
              let text = keptBlocks.join(SEPARATOR);
              const packedChars = text.length;
              if (omittedFiles.length) {
                // The budget governs patch text; this note is bounded metadata on top of it.
                const shown = omittedFiles.slice(0, 20).join(', ');
                const names = shown.length > 400 ? `${shown.slice(0, 400)}…` : shown;
                const more = omittedFiles.length > 20 ? ` (+${omittedFiles.length - 20} more)` : '';
                text += `\n\n[${omittedFiles.length} file(s) omitted to fit the ${budget}-character patch budget: ${names}${more}]`;
              }
              return { text, kept: keptBlocks.length, packedChars, omitted: omittedFiles.length };
            }

            const diffPack = packDiff(DIFF_BUDGET);
            console.log(`Diff packed: ${diffPack.kept}/${files.length} files, ${diffPack.packedChars}/${DIFF_BUDGET} patch chars, ${diffPack.omitted} omitted.`);

            // Kimi K3 is useful as a last-resort reviewer but can spend a large context and
            // completion budget entirely on reasoning. Preserve the proven bounded prompt:
            // complete file inventory plus a small representative patch sample.
            const KIMI_K3_MODEL = 'kimi-k3';
            const kimiK3Pack = packDiff(1000);
            const fileList = files.map((file) => `${file.filename} (${file.status}, +${file.additions} -${file.deletions})`).join('\n');

            const system = [
              'You are an experienced code reviewer.',
              'First read the linked issue background (if provided) to understand what is being fixed and why, then judge whether the PR actually addresses it.',
              'Review the pull request for correctness, security, maintainability, and CI/configuration risks.',
              'Return concise Markdown in Chinese.',
              'Always reserve enough output budget for the final Markdown review; never spend the entire response on hidden reasoning without a final answer.',
              'If there are no actionable issues, say that clearly and mention residual risks.',
            ].join(' ');
            const kimiK3System = `${system} Focus on high-confidence, high-impact findings supported by the supplied file inventory and patch sample.`;

            const buildUser = (diffText, options = {}) => [
              `Repository: ${owner}/${repo}`,
              `Pull Request: #${pull.number} ${pull.title}`,
              `Author: ${pull.user.login}`,
              `Base: ${pull.base.ref}`,
              `Head: ${pull.head.ref}`,
              '',
              'PR description:',
              (pull.body || '[No description]').slice(0, options.descriptionLimit ?? 4000),
              '',
              (options.issueText ?? issueContext)
                ? `Referenced issues (background — what & why):\n${options.issueText ?? issueContext}`
                : 'Referenced issues: none.',
              '',
              ...(options.fileList ? ['All changed file names:', options.fileList, ''] : []),
              'Changed files and patches:',
              diffText || '[No diff available]',
            ].join('\n');
            const user = buildUser(diffPack.text);
            const kimiK3User = buildUser(kimiK3Pack.text, {
              descriptionLimit: 2000,
              issueText: issueContext.slice(0, 2000),
              fileList,
            });

            const models = (process.env.PR_REVIEW_MODELS || '')
              .split(',')
              .map((m) => m.trim())
              .filter(Boolean);
            if (models.length === 0) {
              throw new Error('PR_REVIEW_MODELS must list at least one model id.');
            }
            const parseJsonEnv = (name) => {
              try {
                return JSON.parse(process.env[name] || '{}');
              } catch (error) {
                console.log(`Invalid ${name} JSON, ignoring it: ${error.message}`);
                return {};
              }
            };
            const MODEL_LABELS = parseJsonEnv('PR_REVIEW_MODEL_LABELS');
            const FALLBACKS = parseJsonEnv('PR_REVIEW_FALLBACKS');
            const MODEL_PROVIDERS = parseJsonEnv('PR_REVIEW_MODEL_PROVIDERS');
            const GOOGLE_MODELS = new Set(['gemini-3.7-flash']);
            const ALLOWED_PROVIDERS = new Set(['alibaba', 'tencent', 'google']);
            const providerOf = (model) => MODEL_PROVIDERS[model];
            if (new Set(models).size !== models.length) {
              throw new Error('PR_REVIEW_MODELS must not contain duplicate model ids.');
            }
            const primaryModels = new Set(models);
            const activeFallbacks = [];
            for (const primary of models) {
              const chain = FALLBACKS[primary] ?? [];
              if (!Array.isArray(chain)) {
                throw new Error(`Fallback chain for ${primary} must be an array.`);
              }
              const duplicatePrimary = chain.find((model) => primaryModels.has(model));
              if (duplicatePrimary) {
                throw new Error(
                  `Fallback chain for ${primary} includes configured primary ${duplicatePrimary}; `
                  + 'a model cannot run in parallel and also serve as a fallback.'
                );
              }
              const primaryProvider = providerOf(primary);
              if (!primaryProvider || !ALLOWED_PROVIDERS.has(primaryProvider)) {
                throw new Error(`Model ${primary} must map to a supported provider in PR_REVIEW_MODEL_PROVIDERS.`);
              }
              const crossProvider = chain.find((model) => providerOf(model) !== primaryProvider);
              if (crossProvider) {
                throw new Error(
                  `Fallback ${crossProvider} for ${primary} crosses providers `
                  + `(${primaryProvider} -> ${providerOf(crossProvider) || 'unmapped'}); provider failover chains must stay isolated.`
                );
              }
              activeFallbacks.push(...chain);
            }
            const configuredModels = [
              ...models,
              ...activeFallbacks,
            ];
            for (const model of configuredModels) {
              const provider = providerOf(model);
              if (!provider || !ALLOWED_PROVIDERS.has(provider)) {
                throw new Error(`Model ${model} must map to a supported provider in PR_REVIEW_MODEL_PROVIDERS.`);
              }
              if ((provider === 'google') !== GOOGLE_MODELS.has(model)) {
                throw new Error(`Model ${model} has a provider/protocol mismatch: ${provider}.`);
              }
            }
            const configuredProviders = new Set(configuredModels.map(providerOf));
            if (configuredProviders.has('alibaba') && (!process.env.OPENAI_API_KEY || !process.env.OPENAI_API_BASE)) {
              throw new Error('PR_AGENT_OPENAI_KEY and PR_AGENT_OPENAI_API_BASE are required for Alibaba models.');
            }
            if (configuredProviders.has('tencent') && (!process.env.TENCENT_API_KEY || !process.env.TENCENT_API_BASE)) {
              throw new Error('PR_AGENT_TENCENT_KEY and PR_AGENT_TENCENT_API_BASE are required for Tencent models.');
            }
            if (configuredProviders.has('google') && !process.env.GOOGLE_AI_API_KEY) {
              throw new Error('PR_AGENT_GOOGLE_AI_KEY is required for Google models.');
            }
            const PROVIDER_CONFIG = {
              alibaba: {
                baseUrl: (process.env.OPENAI_API_BASE || '').replace(/\/$/, ''),
                apiKey: process.env.OPENAI_API_KEY,
              },
              tencent: {
                baseUrl: (process.env.TENCENT_API_BASE || '').replace(/\/$/, ''),
                apiKey: process.env.TENCENT_API_KEY,
              },
            };
            const maxAttempts = 3;
            // A healthy response with heavy reasoning has been observed at ~270s, so give one
            // attempt 5 minutes. But an upstream can also accept the connection and then hang
            // without replying; MODEL_BUDGET_MS is a hard wall-clock cap so retries + the
            // field-repair loop can never run away (the regression that let one job spin for
            // 26 minutes was a 480s timeout x 4 attempts x a fallback chain).
            const requestTimeoutMs = 300000;
            const MODEL_BUDGET_MS = 360000;

            // Some upstreams (e.g. MiniMax) inline their chain-of-thought into `content`
            // instead of `reasoning_content`. Never let that reach the PR comment.
            function stripThinking(text) {
              if (!text) return '';
              return text
                .replace(/<think>[\s\S]*?<\/think>/gi, '')
                .replace(/<\/?think>/gi, '')
                .trim();
            }

            // Optional request fields an upstream may reject outright. Dropping one and
            // retrying is always safe; `model`/`messages`/`stream` never are.
            const DROPPABLE_FIELDS = new Set([
              'enable_thinking', 'temperature', 'top_p', 'max_tokens', 'max_output_tokens',
            ]);
            const EXTRA_FIELD_REJECTED = [
              /Extra inputs are not permitted, field: '([^']+)'/i,
              /unknown field:? '?([a-z_]+)'?/i,
              /unsupported parameter:? '?([a-z_]+)'?/i,
            ];

            function basePayload(model) {
              const messages = [
                { role: 'system', content: model === KIMI_K3_MODEL ? kimiK3System : system },
                { role: 'user', content: model === KIMI_K3_MODEL ? kimiK3User : user },
              ];
              const payload = {
                model,
                messages,
                stream: false,
                max_tokens: model === KIMI_K3_MODEL ? 8192 : 16384,
              };
              // Kimi K3 uses fixed sampling and rejects caller-supplied temperature.
              if (model !== KIMI_K3_MODEL) payload.temperature = 0.2;
              return payload;
            }

            function googlePayload() {
              return {
                systemInstruction: { parts: [{ text: system }] },
                contents: [{ role: 'user', parts: [{ text: user }] }],
                generationConfig: { maxOutputTokens: 16384 },
              };
            }

            function classifyFailure(response, responseText, requestError) {
              const status = response?.status;
              const rawText = `${responseText || ''}\n${requestError || ''}`;
              const text = rawText.toLowerCase();
              const quotaExhausted = status === 429 && (
                text.includes('insufficient_quota')
                || /token[- ]?plan[^\n]*quota[^\n]*(exhausted|reached)/i.test(text)
                || /weekly[^\n]*quota[^\n]*(exhausted|reached)/i.test(text)
                || /quota[^\n]*reset at/i.test(text)
              );
              const authenticationFailed = status === 401 || (
                status === 403
                && /(invalid[_ -]?api[_ -]?key|authentication|unauthori[sz]ed)/i.test(text)
              );
              const gatewayBlocked = /^\s*(<!doctype html|<html\b)/i.test(responseText || '')
                || (!response?.ok && text.includes('验证失败'));
              const endpointUnavailable = !response && (
                /fetch failed|enotfound|eai_again|getaddrinfo|econnrefused|certificate|\btls\b/i.test(text)
              );

              if (quotaExhausted) return { kind: 'quota-exhausted', stopRetries: true, stopFallbacks: true };
              if (authenticationFailed) return { kind: 'authentication-failed', stopRetries: true, stopFallbacks: true };
              if (gatewayBlocked) return { kind: 'gateway-blocked', stopRetries: true, stopFallbacks: true };
              if (endpointUnavailable) return { kind: 'endpoint-unavailable', stopRetries: false, stopFallbacks: true };
              return { kind: 'model-or-upstream-failure', stopRetries: false, stopFallbacks: false };
            }

            async function callOnce(model, payload, deadline) {
              const requestBody = JSON.stringify(payload);
              let response;
              let responseText = '';
              let requestError = '';
              let failureKind = '';
              let stopFallbacks = false;
              let attempts = 0;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                attempts = attempt;
                response = undefined;
                responseText = '';
                requestError = '';
                // Never let a single attempt run past the model's wall-clock budget: cap it to
                // whatever time is left, and give up rather than starting an attempt with none.
                const remaining = deadline - Date.now();
                if (remaining <= 0) {
                  requestError = `Gave up on ${model} after its ${MODEL_BUDGET_MS / 1000}s budget was exhausted (upstream likely hung).`;
                  console.log(`[${model}] attempt ${attempt}/${maxAttempts} skipped: model budget exhausted`);
                  break;
                }
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), Math.min(requestTimeoutMs, remaining));
                try {
                  const provider = providerOf(model);
                  const isGoogle = provider === 'google';
                  const providerConfig = PROVIDER_CONFIG[provider];
                  const endpoint = isGoogle
                    ? `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`
                    : `${providerConfig.baseUrl}/chat/completions`;
                  response = await fetch(endpoint, {
                    method: 'POST',
                    signal: controller.signal,
                    headers: isGoogle ? {
                      'x-goog-api-key': process.env.GOOGLE_AI_API_KEY,
                      'content-type': 'application/json',
                      accept: 'application/json',
                      'user-agent': 'GitHubActions-AI-PR-Review',
                    } : {
                      authorization: `Bearer ${providerConfig.apiKey}`,
                      'content-type': 'application/json',
                      accept: 'application/json',
                      'user-agent': 'GitHubActions-AI-PR-Review',
                    },
                    body: isGoogle ? JSON.stringify(googlePayload()) : requestBody,
                  });
                  responseText = await response.text();
                } catch (error) {
                  requestError = error?.name === 'AbortError'
                    ? 'AI endpoint request aborted (per-attempt timeout or model budget reached).'
                    : (error?.message || String(error));
                } finally {
                  clearTimeout(timeout);
                }
                const failure = classifyFailure(response, responseText, requestError);
                if (response?.ok && failure.kind !== 'gateway-blocked') break;
                const status = response?.status ?? 'request failed';
                const diag = (responseText || requestError || '').slice(0, 1000);
                console.log(`[${model}] provider=${providerOf(model)} api=${GOOGLE_MODELS.has(model) ? 'generateContent' : 'chat/completions'} attempt ${attempt}/${maxAttempts} failed: status=${status} body=${diag}`);
                failureKind = failure.kind;
                stopFallbacks = failure.stopFallbacks;
                // Retry transient failures only (5xx, 429, network/timeout); other 4xx are
                // request/auth problems that will not fix themselves on retry.
                const retriable = !response || response.status >= 500 || response.status === 429;
                if (failure.stopRetries || !retriable || attempt === maxAttempts) break;
                // Exponential backoff with jitter (~3s, ~9s): rides out short upstream blips.
                // Skip the wait entirely if it would eat into the budget — better to spend the
                // remaining time on a real attempt (or on the fallback) than on sleeping.
                const backoff = 3000 * Math.pow(3, attempt - 1) + Math.floor(Math.random() * 1000);
                if (Date.now() + backoff >= deadline) break;
                await new Promise((resolve) => setTimeout(resolve, backoff));
              }
              if (response?.ok && !failureKind) {
                return { response, responseText, requestError, attempts, failureKind: '', stopFallbacks: false };
              }
              return { response, responseText, requestError, attempts, failureKind, stopFallbacks };
            }

            // The gateway silently re-routes a model between upstreams, and upstreams disagree
            // about which optional fields exist. When one rejects a field by name, drop it and
            // retry rather than losing the whole review.
            async function callModel(model) {
              // One budget per model covers all its attempts and field-repair retries. Each
              // model in a fallback chain gets a fresh budget, so a hung primary is abandoned
              // in bounded time and the fallback still gets its own full window.
              const deadline = Date.now() + MODEL_BUDGET_MS;
              const payload = basePayload(model);
              if (GOOGLE_MODELS.has(model)) {
                return callOnce(model, payload, deadline);
              }
              for (let repair = 0; repair <= DROPPABLE_FIELDS.size; repair++) {
                const result = await callOnce(model, payload, deadline);
                if (result.response?.status !== 400) return result;
                const text = result.responseText || '';
                const matched = EXTRA_FIELD_REJECTED.map((re) => re.exec(text)).find(Boolean);
                const field = matched?.[1];
                if (!field || !DROPPABLE_FIELDS.has(field) || !(field in payload)) return result;
                console.log(`[${model}] upstream rejected optional field '${field}'; dropping it and retrying.`);
                delete payload[field];
              }
              return callOnce(model, payload, deadline);
            }

            function extractReview(model, responseText) {
              const payload = JSON.parse(responseText);
              if (GOOGLE_MODELS.has(model)) {
                const candidate = payload?.candidates?.[0];
                const parts = Array.isArray(candidate?.content?.parts) ? candidate.content.parts : [];
                const content = stripThinking(parts
                  .filter((part) => part?.thought !== true)
                  .map((part) => part?.text || '')
                  .join('\n'));
                const finishReason = candidate?.finishReason;
                console.log(`[${model}] api=generateContent finish_reason=${finishReason} contentLen=${content.length} usage=${JSON.stringify(payload?.usageMetadata)}`);
                let review = content;
                if (review && finishReason && finishReason !== 'STOP') {
                  review += '\n\n> ⚠️ 模型输出未完整结束，这条 review 可能不完整。';
                }
                return { review, reasoningLength: 0 };
              }
              const choice = payload?.choices?.[0];
              const message = choice?.message;
              const finishReason = choice?.finish_reason;
              const reasoning = message?.reasoning_content || '';
              const content = stripThinking(message?.content);
              // Never publish provider reasoning as a review. An empty final response makes
              // the caller continue to its configured fallback instead.
              let review = content;
              console.log(`[${model}] api=chat/completions upstream=${payload?.model} finish_reason=${finishReason} contentLen=${message?.content?.length || 0} reasoningLen=${reasoning.length} usage=${JSON.stringify(payload?.usage)}`);
              if (review && finishReason === 'length') {
                review += '\n\n> ⚠️ 模型输出达到 max_tokens 上限，这条 review 可能不完整。';
              }
              return { review, reasoningLength: reasoning.length };
            }

            // Try the primary model, then same-provider fallbacks. Shared provider failures
            // short-circuit the lane so the full context is not resent to the same endpoint.
            async function requestReview(primary) {
              const chain = [primary, ...(Array.isArray(FALLBACKS[primary]) ? FALLBACKS[primary] : [])];
              const tried = [];
              let lastResponse;
              let lastResponseText = '';
              let lastRequestError = '';
              let lastFailureKind = '';
              let stoppedSharedLane = false;

              for (const model of chain) {
                const { response, responseText, requestError, attempts, failureKind, stopFallbacks } = await callModel(model);
                lastResponse = response;
                lastResponseText = responseText;
                lastRequestError = requestError;
                lastFailureKind = failureKind;
                if (response?.ok) {
                  try {
                    const { review, reasoningLength } = extractReview(model, responseText);
                    if (review) {
                      return { primary, servedBy: model, review, reasoningLength, degraded: model !== primary };
                    }
                    console.log(`[${model}] response parsed but contained no review text.`);
                  } catch (error) {
                    console.log(`[${model}] parse error: ${error?.message || error}`);
                  }
                }
                tried.push(`${model} -> HTTP ${response?.status ?? 'request failed'} (${attempts ?? 0} attempt(s))`);
                if (stopFallbacks && model !== chain[chain.length - 1]) {
                  stoppedSharedLane = true;
                  console.log(`[${primary}] ${failureKind} affects the shared ${providerOf(primary)} lane; skipping same-provider fallback requests.`);
                  break;
                }
                if (model !== chain[chain.length - 1]) {
                  console.log(`[${primary}] falling back to the next model in the chain.`);
                }
              }

              const failText = (lastResponseText || lastRequestError || '').trim();
              const gatewayBlocked = lastFailureKind === 'gateway-blocked';
              const upstreamExhausted = failText.includes('failover_exhausted');
              const status = lastResponse?.status ?? 'request failed';
              const isServerSide = typeof status === 'number' && status >= 500;
              const stoppedSummary = stoppedSharedLane
                ? `The failure applies to the shared ${providerOf(primary)} endpoint, so same-provider fallbacks were skipped to avoid duplicate requests. Reason: ${lastFailureKind}.`
                : `Review attempts did not produce a usable response. Tried: ${tried.join('; ')}.`;
              const fence = '```';
              const snippet = failText.replace(/`/g, "'").slice(0, 600);
              const review = [
                '> AI review was not generated.',
                '',
                gatewayBlocked
                  ? 'GitHub Actions reached the configured API endpoint, but the gateway returned an HTML verification page instead of JSON.'
                  : stoppedSummary,
                '',
                snippet
                  ? `<details><summary>Upstream response (truncated)</summary>\n\n${fence}\n${snippet}\n${fence}\n</details>`
                  : '',
                '',
                gatewayBlocked
                  ? 'Action needed: use an API base URL that GitHub-hosted runners can reach without browser verification, or run this workflow on a self-hosted runner.'
                  : lastFailureKind === 'quota-exhausted'
                    ? 'Action needed: the shared Token Plan quota is exhausted. Wait for its reset or replenish it; retrying another model on the same plan cannot recover the review.'
                    : lastFailureKind === 'authentication-failed'
                      ? `Action needed: repair the shared ${providerOf(primary)} API key or authentication configuration.`
                      : lastFailureKind === 'endpoint-unavailable'
                        ? 'Action needed: the configured Model Studio endpoint remained unreachable after retries. Same-endpoint model fallbacks cannot bypass this network failure.'
                  : upstreamExhausted
                    ? 'Action needed: `failover_exhausted` means the gateway ran out of healthy upstreams for every model in the chain — a provider-side outage, not a problem with this repo, the key, or the model name. It usually clears on its own; if it persists, point `models`/`fallbacks` at ids on a different upstream (see the mapping at the top of pr-review.yml).'
                    : isServerSide
                      ? 'Action needed: a 5xx originates from the model gateway/account, not from GitHub access. Check the upstream response above — most often quota/balance exhausted, an invalid or expired key, a wrong model name, or a provider-side outage.'
                      : 'Action needed: inspect the upstream response above to identify the request or auth problem.',
              ].join('\n');

              return { primary, servedBy: null, review, reasoningLength: 0, degraded: false };
            }

            // Context collection can take long enough for another push to land. Re-read the
            // head immediately before dispatch so neither full-context reviewer spends tokens
            // on a commit that is no longer current.
            const { data: latestPull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (latestPull.head.sha !== reviewHeadSha || (latestPull.state && latestPull.state !== 'open')) {
              console.log(`Skip stale review before model dispatch: prepared=${reviewHeadSha.slice(0, 7)} current=${latestPull.head.sha.slice(0, 7)} state=${latestPull.state || 'unknown'}.`);
              return;
            }

            const headSha = reviewHeadSha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const labelOf = (model) => MODEL_LABELS[model] || model;

            // Run every configured model in parallel, then post one comment per model.
            const settled = await Promise.allSettled(models.map((model) => requestReview(model)));

            // Model calls can outlive the commit they reviewed. Do not attach completed
            // results to a newer head (or to a PR that was closed while they were running).
            const { data: publishPull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (publishPull.head.sha !== reviewHeadSha || publishPull.state !== 'open') {
              console.log(`Skip stale review before comment publishing: reviewed=${reviewHeadSha.slice(0, 7)} current=${publishPull.head.sha.slice(0, 7)} state=${publishPull.state || 'unknown'}.`);
              return;
            }

            let posted = 0;
            for (let i = 0; i < settled.length; i++) {
              const primary = models[i];
              if (settled[i].status === 'rejected') {
                console.log(`[${primary}] review pipeline threw: ${settled[i].reason?.message || settled[i].reason}`);
                continue;
              }
              const { servedBy, review, reasoningLength, degraded } = settled[i].value;
              const modelLine = degraded
                ? `Model: ${primary} unavailable -> served by ${servedBy}`
                : `Model: ${servedBy ?? primary}`;
              const banner = degraded
                ? [`> ℹ️ \`${labelOf(primary)}\` 当前不可用，本条 review 由备用模型 \`${labelOf(servedBy)}\` 生成。`, '']
                : [];
              const body = [
                `<!-- ai-pr-review-bot:${primary} -->`,
                `## AI PR Review · ${labelOf(primary)}`,
                '',
                ...banner,
                review,
                '',
                `<sub>${modelLine} · Thinking: ${reasoningLength ? `${reasoningLength} chars` : 'not reported'} · Commit: ${headSha} · [Run](${runUrl})</sub>`,
              ].join('\n');
              try {
                const { data: createdComment } = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pullNumber,
                  body,
                });
                posted++;
                console.log(`Created AI PR Review comment ${createdComment.id} for ${primary}.`);
              } catch (error) {
                // One failed comment must not swallow the others.
                console.log(`Failed to post comment for ${primary}: ${error?.message || error}`);
              }
            }
            if (posted === 0) {
              throw new Error('No AI PR Review comment could be posted for any configured model.');
            }
