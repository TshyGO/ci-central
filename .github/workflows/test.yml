name: Test

# pr-review.yml carries its review logic as an inline `script:`, which nothing type-checks.
# test/pr-review.test.mjs extracts that exact script and exercises it against a mocked
# GitHub API and a stubbed fetch. review-config.test.mjs validates repository selection,
# Lane isolation, and the bundled resolver used by callers.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/review-config.test.mjs
      - run: node test/pr-review.test.mjs
      - run: node test/pr-review-retry.test.mjs
